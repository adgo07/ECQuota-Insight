name: QZC N01-A Numeric Pilot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric-pilot:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile and static import check
        shell: pwsh
        run: python -m compileall -q src tests

      - name: Execute N01-A conformance vectors
        shell: pwsh
        run: python -m pytest tests/pilots/numeric/test_qzc_n01_a.py -vv -p no:cacheprovider

      - name: Execute GB 29446 regression and legacy migration evidence
        shell: pwsh
        run: python -m pytest tests/test_gb29446.py -q -ra -p no:cacheprovider

      - name: Execute numeric domain and import regressions
        shell: pwsh
        run: python -m pytest tests/test_engine.py tests/test_excel.py -q -ra -p no:cacheprovider

      - name: Execute full suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          python -m pytest -q -ra -p no:cacheprovider --basetemp work/pytest-n01-a
