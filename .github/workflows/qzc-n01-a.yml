name: QZC N01-A Numeric Pilot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# ECQ-RS05 M2 §一：同一 PR 新 Head 推送后取消旧 Head 的运行，避免继续消耗资源。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numeric-pilot:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile and static import check
        shell: pwsh
        run: python -m compileall -q src tests tools

      - name: Execute N01-A conformance vectors
        shell: pwsh
        run: python -m pytest tests/pilots/numeric/test_qzc_n01_a.py -vv -p no:cacheprovider

      - name: Execute GB 29446 regression and legacy migration evidence
        shell: pwsh
        run: python -m pytest tests/test_gb29446.py -q -ra -p no:cacheprovider

      - name: Execute numeric domain and import regressions
        shell: pwsh
        run: python -m pytest tests/test_engine.py tests/test_excel.py -q -ra -p no:cacheprovider

      - name: Execute GB 29446 UI regression
        shell: pwsh
        run: python -m pytest tests/test_ui.py -q -ra -p no:cacheprovider

      - name: Probe Excel/openpyxl numeric ingress
        shell: pwsh
        run: python tools/qzc_n01_a_excel_ingress_probe.py

      - name: Summarize the N01-A gate
        shell: pwsh
        run: |
          # ECQ-RS05 M2 §一：literal full suite 不再在本 workflow 里重复执行。
          # 它由 Pull Request Gate 严格执行一次（见 .github/workflows/pull-request-gate.yml）；
          # 本 job 只承担 N01-A vectors / GB 29446 / Numeric / UI 回归与 Excel 入口探针。
          # Artifact Gate 只在 scripts/build_candidate.ps1 内部执行一次。
          Write-Host "N01-A conformance vectors + GB 29446 + Numeric/UI regressions + Excel ingress probe executed."
          Write-Host "Literal full suite (strict, single execution): Pull Request Gate / full-suite."
          Write-Host "Release-asset checks stay in the Source Gate (tests/test_release_source.py); the Artifact Gate runs inside scripts/build_candidate.ps1 (tests/test_release_artifacts.py with UEBENCH_ARTIFACT_DIR)."
