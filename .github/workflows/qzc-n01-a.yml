name: QZC N01-A Numeric Pilot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric-pilot:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile and static import check
        shell: pwsh
        run: python -m compileall -q src tests tools

      - name: Execute N01-A conformance vectors
        shell: pwsh
        run: python -m pytest tests/pilots/numeric/test_qzc_n01_a.py -vv -p no:cacheprovider

      - name: Execute GB 29446 regression and legacy migration evidence
        shell: pwsh
        run: python -m pytest tests/test_gb29446.py -q -ra -p no:cacheprovider

      - name: Execute numeric domain and import regressions
        shell: pwsh
        run: python -m pytest tests/test_engine.py tests/test_excel.py -q -ra -p no:cacheprovider

      - name: Execute GB 29446 UI regression
        shell: pwsh
        run: python -m pytest tests/test_ui.py -q -ra -p no:cacheprovider

      - name: Probe Excel/openpyxl numeric ingress
        shell: pwsh
        run: python tools/qzc_n01_a_excel_ingress_probe.py

      - name: Execute literal full suite
        id: literal_full_suite
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          python -m pytest -q -ra -p no:cacheprovider --basetemp work/pytest-n01-a-full

      - name: Verify all tests except two pre-existing baseline asset failures
        shell: pwsh
        run: |
          python -m pytest -q -ra -p no:cacheprovider --basetemp work/pytest-n01-a-clean `
            --deselect tests/test_development_library.py::test_unified_development_library_index_is_complete `
            --deselect tests/test_frozen_release.py::test_portable_release_does_not_bundle_incompatible_poppler_icu

      - name: Prove the two excluded failures already exist on PR base
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git worktree add ../n01-a-base ${{ github.event.pull_request.base.sha }}
          Push-Location ../n01-a-base
          python -m pytest tests/test_development_library.py::test_unified_development_library_index_is_complete -q -p no:cacheprovider
          $developmentExit = $LASTEXITCODE
          if ($developmentExit -eq 0) {
            throw "Base unexpectedly passes development-library manifest test; exclusion is no longer justified."
          }
          if ($developmentExit -ne 1) {
            throw "Base development-library test exited with unexpected code $developmentExit."
          }

          python -m pytest tests/test_frozen_release.py::test_portable_release_does_not_bundle_incompatible_poppler_icu -q -p no:cacheprovider
          $releaseExit = $LASTEXITCODE
          if ($releaseExit -eq 0) {
            throw "Base unexpectedly passes frozen-release artifact test; exclusion is no longer justified."
          }
          if ($releaseExit -ne 1) {
            throw "Base frozen-release test exited with unexpected code $releaseExit."
          }
          Pop-Location

      - name: Summarize literal full-suite outcome
        shell: pwsh
        run: |
          Write-Host "Literal full-suite step outcome: ${{ steps.literal_full_suite.outcome }}"
          Write-Host "Two known base failures are independently re-executed on the PR base in the preceding step."
