name: Apply Numeric v1 Adoption Patch

on:
  push:
    branches:
      - adopt/numeric-contract-v1-full
    paths:
      - tools/apply_numeric_v1_excel_guard.py
      - .github/workflows/apply-numeric-v1-adoption.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adopt/numeric-contract-v1-full
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply Excel authoritative-float guard
        shell: pwsh
        run: |
          python tools/apply_numeric_v1_excel_guard.py
          python -m compileall -q src tests tools
          git diff --check
      - name: Commit generated ingress guard
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uebench/infrastructure/excel.py
          if (git diff --cached --quiet) {
            throw "Excel Numeric v1 guard produced no changes."
          }
          git commit -m "fix: reject authoritative XLSX binary-float ingress"
          git push origin HEAD:adopt/numeric-contract-v1-full
