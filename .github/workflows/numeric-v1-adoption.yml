name: Numeric v1 Full Adoption

on:
  push:
    branches:
      - adopt/numeric-contract-v1-full
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# ECQ-RS05 M2 §一：同一 PR 新 Head 推送后取消旧 Head 的运行，避免继续消耗资源。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numeric-v1-adoption:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout adoption head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile and static import check
        shell: pwsh
        run: python -m compileall -q src tests tools

      - name: Assert legacy global ROUND6 is absent from production comparison
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          engine = Path("src/uebench/domain/engine.py").read_text(encoding="utf-8")
          forbidden = ["_round_threshold_value", "_THRESHOLD_COMPARISON_QUANTUM", "ecquota-legacy-round6-v1", "ROUND({actual}, 6)"]
          hits = [item for item in forbidden if item in engine]
          if hits:
              raise SystemExit(f"legacy authoritative ROUND6 tokens remain: {hits}")
          print("PASS: public Engine has no legacy global ROUND6 comparison helper/path")
          '@ | python -

      - name: Assert published rules do not silently declare rounding
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          hits = []
          for path in sorted(Path("data/definitions").glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              def walk(obj, trail):
                  if isinstance(obj, dict):
                      if obj.get("round_places") is not None:
                          hits.append((path.name, "/".join(trail), obj.get("round_places"), obj.get("rounding")))
                      for k, v in obj.items():
                          walk(v, trail + [str(k)])
                  elif isinstance(obj, list):
                      for i, v in enumerate(obj):
                          walk(v, trail + [str(i)])
              walk(data, [])
          for item in hits:
              if item[3] is None:
                  raise SystemExit(f"implicit Rule rounding found: {item}")
          print(f"published explicit rounding declarations: {len(hits)}")
          '@ | python -

      - name: Execute Frozen Numeric v1 Conformance
        shell: pwsh
        run: python -m pytest tests/conformance/numeric/test_ecquota_numeric_v1.py -vv -p no:cacheprovider

      - name: Execute N01-A migration evidence
        shell: pwsh
        run: python -m pytest tests/pilots/numeric/test_qzc_n01_a.py tests/test_gb29446.py -q -ra -p no:cacheprovider

      - name: Execute numeric domain and import regressions
        shell: pwsh
        run: python -m pytest tests/test_engine.py tests/test_excel.py -q -ra -p no:cacheprovider

      - name: Execute GB 29446 UI regression
        shell: pwsh
        run: python -m pytest tests/test_ui.py -q -ra -p no:cacheprovider

      - name: Record resolved Numeric dependency versions
        shell: pwsh
        run: |
          python -m pip freeze | Select-String -Pattern '^(jsonschema|jsonschema-specifications|attrs|referencing|rpds-py)='

      - name: Summarize the numeric gate
        shell: pwsh
        run: |
          # ECQ-RS05 M2 §一：literal full suite 不再在本 workflow 里重复执行。
          # 它由 Pull Request Gate 严格执行一次（见 .github/workflows/pull-request-gate.yml）；
          # 本 job 只承担 Frozen Numeric v1 专项、N01-A migration evidence 与 Numeric/UI 回归。
          # Artifact Gate 只在 scripts/build_candidate.ps1 内部执行一次。
          Write-Host "Numeric v1 Conformance + N01-A migration evidence + Numeric/UI regressions executed."
          Write-Host "Literal full suite (strict, single execution): Pull Request Gate / full-suite."
          Write-Host "Release-asset checks stay in the Source Gate (tests/test_release_source.py); the Artifact Gate runs inside scripts/build_candidate.ps1 (tests/test_release_artifacts.py with UEBENCH_ARTIFACT_DIR)."
