name: Finalize Numeric v1 Handoff

on:
  push:
    branches:
      - adopt/numeric-contract-v1-full
    paths:
      - tools/finalize_numeric_v1_handoff.py
      - .github/workflows/finalize-numeric-v1-handoff.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adopt/numeric-contract-v1-full
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh HANDOFF current Numeric status
        shell: pwsh
        run: |
          python tools/finalize_numeric_v1_handoff.py
          git diff --check
      - name: Commit HANDOFF refresh
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HANDOFF.md
          if (git diff --cached --quiet) { throw "HANDOFF refresh produced no change" }
          git commit -m "docs: refresh handoff for Numeric v1 adoption"
          git push origin HEAD:adopt/numeric-contract-v1-full
