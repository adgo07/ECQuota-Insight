name: Windows Release Candidate

# ECQ-RS05 §8: this workflow builds and verifies a Windows Release Candidate.
#
# It is deliberately SEPARATE from the Numeric workflows (QZC N01-A Numeric
# Pilot / Numeric v1 Full Adoption): those two prove numeric semantics and must
# stay free of release-build concerns.  This one owns the release chain:
#
#   Version consistency Gate -> Source Gate -> literal full suite
#   -> Candidate build -> Artifact Gate -> Candidate artifacts
#
# The Candidate artifacts uploaded here are Candidate deliverables, not a formal
# release; the build declares itself unsigned (release-build-info.json:
# authenticode_signed = false).
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Install pinned dependencies from requirements.lock
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Compile and static import check
        shell: pwsh
        run: python -m compileall -q src tests tools

      - name: Read the authoritative version and artifact names
        id: version
        shell: pwsh
        run: |
          python tools/release_version.py --check
          if ($LASTEXITCODE -ne 0) { throw "版本一致性校验失败。" }
          $version = (python tools/release_version.py --print).Trim()
          $names = (python tools/release_version.py --names) -join "`n"
          if ([string]::IsNullOrWhiteSpace($version)) { throw "未取得产品版本。" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "names<<NAMES_EOF" >> $env:GITHUB_OUTPUT
          $names >> $env:GITHUB_OUTPUT
          "NAMES_EOF" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-ChildItem -Path "C:\Program Files (x86)","C:\Program Files" -Recurse `
                -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { throw "未找到 Inno Setup 6 编译器 ISCC.exe" }
          Write-Host "Inno Setup compiler: $iscc"
          $isccDir = Split-Path -Parent $iscc
          $isccDir >> $env:GITHUB_PATH

      - name: Execute release source gate
        shell: pwsh
        run: python -m pytest tests/test_release_version_consistency.py tests/test_release_source.py -q -ra -p no:cacheprovider

      - name: Execute literal full suite
        id: literal_full_suite
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          python -m pytest -q -ra -p no:cacheprovider --basetemp work/pytest-candidate-full

      - name: Build the Windows Release Candidate
        shell: pwsh
        env:
          NAMES_JSON: ${{ steps.version.outputs.names }}
        run: |
          scripts/build_candidate.ps1 -NamesJson $env:NAMES_JSON -OutputDir "dist/candidate"

      - name: Verify the Candidate artifacts with the Artifact Gate
        shell: pwsh
        env:
          UEBENCH_ARTIFACT_DIR: dist/candidate
        run: |
          python -m pytest tests/test_release_artifacts.py -q -ra -p no:cacheprovider --basetemp work/pytest-candidate-artifacts

      - name: Upload Candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UEBench-Candidate-${{ steps.version.outputs.version }}-win-x64
          path: |
            dist/candidate/UEBench-${{ steps.version.outputs.version }}-win-x64.zip
            dist/candidate/UEBench-Setup-${{ steps.version.outputs.version }}-x64.exe
            dist/candidate/UEBench-source-${{ steps.version.outputs.version }}.zip
            dist/candidate/initial-standard-package-published.uebench
            dist/candidate/GB29446选煤电力消耗限额导入模板.xlsx
            dist/candidate/SHA256SUMS.txt
            dist/candidate/payload-manifest.json
            dist/candidate/release-build-info.json
            dist/candidate/验收助手.ps1
            dist/candidate/验收助手.cmd
            dist/candidate/安装与发布说明-${{ steps.version.outputs.version }}.md
            dist/candidate/交付清单-${{ steps.version.outputs.version }}.md
          if-no-files-found: error
          retention-days: 30

      - name: Summarize the Candidate run
        shell: pwsh
        run: |
          Write-Host "Product version: ${{ steps.version.outputs.version }}"
          Write-Host "Literal full-suite outcome: ${{ steps.literal_full_suite.outcome }}"
          Write-Host "Candidate directory: dist/candidate"
          Get-ChildItem -LiteralPath dist/candidate -File | Sort-Object Name |
            ForEach-Object { Write-Host ("  {0,12}  {1}" -f $_.Length, $_.Name) }
